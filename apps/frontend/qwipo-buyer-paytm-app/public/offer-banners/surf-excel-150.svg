      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <clipPath id="se-clip"><rect width="240" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#se-clip)">
    <rect width="240" height="240" fill="url(#se-bg)"/>
    <circle cx="208" cy="206" r="74" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="30" cy="16" r="44" fill="#FFFFFF" opacity="0.08"/>
    <g fill="#FFFFFF" opacity="0.2">
      <circle cx="196" cy="52" r="15"/>
      <circle cx="218" cy="82" r="9"/>
      <circle cx="184" cy="88" r="6"/>
    </g>

    <text x="20" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.6" fill="#FFFFFF" opacity="0.85">SURF EXCEL</text>

    <text x="20" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="19" font-weight="600" fill="#FFFFFF" opacity="0.9">SAVE</text>
    <text x="20" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="52" font-weight="800" fill="#FFFFFF">&#8377;150</text>

    <text x="20" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
