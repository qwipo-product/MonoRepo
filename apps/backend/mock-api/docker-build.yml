# Build pipeline — mock-api (Bun + Hono, single process).
#
# Register in Azure DevOps as:  docker-cd-mockups-api
#
# Single variant, so no `.api` / `.scheduler` / `.subscriber` suffix on this
# filename — seller-platform splits those out only because those services run
# three separate processes off one codebase. If mock-api ever grows a worker,
# split this into docker-build.api.yml + docker-build.worker.yml and give each
# its own service_name_override.

# trigger:
#     branches:
#         include:
#             - main
#             - dev
#     paths:
#         include:
#             - 'apps/backend/mock-api/**'
#             - 'packages/**'
#             - 'turbo.json'
#             - 'package.json'
#             - 'bun.lock'

trigger: none

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'

extends:
    template: azure-cicd/templates/base-docker-template.yaml@k8s
    parameters:
        service_name_override: mockups-api
        dockerfile: apps/backend/mock-api/Dockerfile
