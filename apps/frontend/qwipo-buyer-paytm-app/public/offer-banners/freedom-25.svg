      <text x="16" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="13" font-weight="700" fill="#0F766E">Shop now</text>
      <path d="M94 14h8m-3-3.5 3.5 3.5-3.5 3.5" stroke="#0F766E" stroke-width="2"
