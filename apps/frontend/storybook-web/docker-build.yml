# Build pipeline — storybook-web (static Storybook catalog behind nginx).
#
# Registered in Azure DevOps as:  \Mockups Lab\Storybook Web - Build
# "Storybook Web - Deploy" binds to that exact display name via
# `resources.pipelines.source`, so renaming this pipeline breaks the release.
# Rename both or neither.
#
# Left on manual trigger — these are demo environments, not services. Uncomment
# the block below only if someone actually wants a push to rebuild
# automatically. `packages/**` is in the path filter because a change to a
# shared package changes this app's output.

# trigger:
#     branches:
#         include:
#             - main
#             - dev
#     paths:
#         include:
#             - 'apps/frontend/storybook-web/**'
#             - 'packages/**'
#             - 'turbo.json'
#             - 'package.json'
#             - 'bun.lock'

trigger: none

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'

extends:
    template: azure-cicd/templates/base-docker-template.yaml@k8s
    parameters:
        service_name_override: 'mockups-storybook-web'
        dockerfile: apps/frontend/storybook-web/Dockerfile
