# Build pipeline — qwipo-buyer-app (static SPA behind nginx).
#
# Register in Azure DevOps as:  docker-cd-mockups-qwipo-buyer-app
# The release pipeline binds to that exact name via `resources.pipelines.source`,
# so renaming the pipeline breaks the release. Rename both or neither.
#
# Left on manual trigger, matching seller-platform. Uncomment the block below
# once someone actually wants a push to dev/main to rebuild automatically —
# note `packages/**` is in the path filter because a change to @mockups/ui
# changes this app's output.

# trigger:
#     branches:
#         include:
#             - main
#             - dev
#     paths:
#         include:
#             - 'apps/frontend/qwipo-buyer-app/**'
#             - 'packages/**'
#             - 'turbo.json'
#             - 'package.json'
#             - 'bun.lock'

trigger: none

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'

extends:
    template: azure-cicd/templates/base-docker-template.yaml@k8s
    parameters:
        service_name_override: mockups-qwipo-buyer-app
        dockerfile: apps/frontend/qwipo-buyer-app/Dockerfile
