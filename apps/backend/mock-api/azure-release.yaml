# Release pipeline — mock-api.
#
# Registered in Azure DevOps as:  \Mockups Lab\Mock API - Deploy
#
# Rewrites the digest at bms-chart/<env>/mockups-api.yaml in the GitOps repo
# (k8s), then syncs the ArgoCD app `<env>-mockups-api-argo-app`.
#
# `source:` below is the build pipeline's display name. Rename that pipeline
# and this string has to change with it.

trigger: none

parameters:
    - name: environment
      displayName: Select Environment To Deploy
      type: string
      default: dev
      values:
          - dev
          - testing
          - staging
          - production

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'
    pipelines:
        - pipeline: buildPipeline
          source: 'Mock API - Build'
          trigger: none

extends:
    template: azure-cicd/templates/base-release-template.yaml@k8s
    parameters:
        environment: ${{ parameters.environment }}
        service_name_override: 'mockups-api'
