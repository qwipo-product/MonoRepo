# Build template for every mockup — the repo-local counterpart of
# azure-cicd/templates/base-docker-template.yaml in the `Qwipo B2B/k8s` repo.
#
# Why a local template: the shared one has no notion of a release — every
# build is `<branch>-<sha>` — and the mockups version their releases with
# semver git tags, the same model as buyer-web-mini in buyer-apps-monorepo.
# Rather than inline that logic once per app, each app's docker-build.yml
# `extends:` this file and passes four parameters. Only the `qwipo-global`
# variable group is shared with the k8s repo.
#
# ── Three kinds of branch ────────────────────────────────────────────────────
#
#   main                      → release: semver tag + image, deployed via ArgoCD
#   dev / testing / staging   → image `<branch>-<sha>`, deployed via ArgoCD
#   dev/* and feature/*       → PREVIEW: no image, no deploy. The built site is
#                               uploaded to the DigitalOcean Space `qwipo-mockups`
#                               and every mockup's nginx serves that bucket under
#                               /builds/ on its own host. See "Preview builds".
#
# ── Versioning model ─────────────────────────────────────────────────────────
#
# main builds get a semver:
#   1. next version = latest `<tag_prefix>-v*` git tag bumped per `bump`
#      (auto-triggered runs always take the default, patch; a manual run may
#      pick minor/major). No tags yet → 1.0.0. The prefix is a STATIC
#      parameter on purpose: deriving it from package.json or the folder name
#      would silently fork the tag lineage the day something is renamed.
#   2. the annotated tag `<tag_prefix>-v<semver>` is pushed BEFORE the image
#      is built. A new-ref push is atomic on the remote, so the number is
#      reserved: of two racing main builds the loser fails at the push, before
#      anything touched the registry, and a re-run computes the next number.
#      A tag whose build fails afterwards simply has no image; the release
#      template's tag mode checks the registry and fails loudly on such a tag.
#   3. image tags: <semver> and <sha>.
# Any other branch (dev, testing, staging) keeps the sha flow — <sha>,
# <branch>, <branch>-<sha> — and no git tag. Consequence: tag-mode releases
# can only ever deploy main-built code.
#
# ── The version is baked into the bundle ─────────────────────────────────────
#
# The mockups have no runtime config (no entrypoint, no config.*.json), so the
# image's own tag is handed to `docker build` as a build arg, the Dockerfile
# exports it as VITE_APP_VERSION, and Vite inlines it. That is what
# @mockups/version-badge shows in the corner of every mockup. One image is one
# version, in every environment — the badge can never name an image that is
# not the one serving the page.
#
# ── Preview builds (dev/*, feature/*) ────────────────────────────────────────
#
# Every push to a personal branch is kept, forever, at a URL of its own:
#
#   https://<service_name>.dev.bms.qwipo.com/builds/<branch>/<sha>/
#   https://<service_name>.dev.bms.qwipo.com/builds/<branch>/latest/
#   https://<service_name>.dev.bms.qwipo.com/builds/            (all branches)
#
# How: the SAME Dockerfile is built, stopped after the `builder` stage, and
# the app's output directory (`out_dir`) is copied out and `aws s3 sync`ed to
# the bucket under `<service_name>/<branch>/<sha>/` and `.../latest/`. Both
# commands run in containers (oven/bun via the Dockerfile, amazon/aws-cli for
# the upload) because the agents ship nothing but docker. A plain HTML index
# of branches and commits is regenerated on every upload.
#
# The bucket is served by the mockup's own nginx (see the `/builds/` block in
# each app's nginx.conf), so a preview is live the moment the upload finishes
# — nothing is deployed and ArgoCD is never involved. The release pipeline
# ignores these branches by its own trigger filter.
#
# Two things the apps had to do for this to work, and must keep doing:
#   - build with a relative base (`base: './'` in vite.config.ts), because the
#     site is served from a sub-path the build can't know;
#   - route on the URL hash (HashRouter), because the bucket has no fallback
#     document — only `/builds/<branch>/<sha>/index.html` exists.
#
# `<branch>` is the full branch name with every non-alphanumeric character
# turned into `-` (`dev/rahul-cart` → `dev-rahul-cart`). Not truncated: it is
# a path segment, not a docker tag.
#
# Credentials: variable group `mockups-spaces` (SPACES_BUCKET, SPACES_REGION,
# SPACES_ENDPOINT, and the secrets SPACES_ACCESS_KEY_ID /
# SPACES_SECRET_ACCESS_KEY of the `mockups-ci` key, which can only touch
# this one bucket).
#
# ── One-time permission ──────────────────────────────────────────────────────
#
# The tag push runs as the project Build Service identity, which needs
# `Contribute` and `Create tag` on THIS repo (Azure DevOps → Project settings →
# Repositories → mockups-lab → Security → "Qwipo B2B Build Service"). Without
# it every main build fails at "push semver git tag" with a 403. Nothing else
# is affected: the push happens before the image build, and non-main branches
# never push a tag. A tag push cannot retrigger a build — triggers are
# branch-only.

parameters:
    - name: service_name
      displayName: Image / ArgoCD service name (mockups-<what-it-is>)
      type: string
    - name: tag_prefix
      displayName: Git tag prefix (tags are <tag_prefix>-v<semver>)
      type: string
    - name: dockerfile
      displayName: Path to Dockerfile (repo-relative)
      type: string
    - name: bump
      displayName: Semver bump on main
      type: string
      default: patch
      values:
          - patch
          - minor
          - major
    - name: out_dir
      displayName: Build output directory inside the app (dist for Vite, storybook-static for Storybook) — preview builds copy this out
      type: string
      default: dist

variables:
    - group: qwipo-global
    - group: mockups-spaces
    # The one branch that cuts releases. Every step below keys off IS_RELEASE,
    # so moving the release branch is this single edit.
    - name: IS_RELEASE
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
          value: 'true'
      ${{ else }}:
          value: 'false'
    # Personal branches never become images: the site goes to the Space and
    # is served under /builds/. Widening this (e.g. to fix/*) is a one-line
    # edit here plus the branch in each app's docker-build.yml trigger.
    - name: IS_PREVIEW
      ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/dev/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')) }}:
          value: 'true'
      ${{ else }}:
          value: 'false'

jobs:
    - job: build_job
      displayName: version, docker build, tag, push

      pool:
          name: Xavica-Qwipo

      steps:
          - checkout: self
            fetchDepth: 1
            # keeps the auth extraheader configured on origin so the tag push
            # below works as the Build Service identity with a plain `git push`
            persistCredentials: true

          - task: CmdLine@2
            displayName: set common variables, compute version
            inputs:
                script: |
                    set -e

                    BRANCH_NAME=$(echo $(Build.SourceBranch) | sed -E 's|refs/heads/||')
                    if [[ ! "$BRANCH_NAME" =~ ^(dev|testing|staging|master|main)$ ]]; then
                      BRANCH_NAME=$(echo "$BRANCH_NAME" | sed -E 's/[^a-zA-Z0-9]/-/g')
                      BRANCH_NAME=${BRANCH_NAME:0:20}
                    fi
                    if [ "$(IS_PREVIEW)" = "true" ]; then
                      # Untruncated: this is a URL path segment, not a docker tag.
                      BRANCH_NAME=$(echo $(Build.SourceBranch) | sed -E 's|refs/heads/||; s/[^a-zA-Z0-9]/-/g')
                    fi

                    SERVICE_NAME='${{ parameters.service_name }}'
                    TAG_PREFIX='${{ parameters.tag_prefix }}'
                    DOCKERFILE_PATH='${{ parameters.dockerfile }}'
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    IMAGE_NAME=$DOCR_NAME/$SERVICE_NAME

                    if [ "$(IS_RELEASE)" = "true" ]; then
                      # Tag NAMES only, straight from the remote — needs no local
                      # tag refs, so it is immune to fetchDepth/fetchTags.
                      # Annotated tags list twice (`x` and `x^{}`); the peeled
                      # lines are dropped.
                      LAST_VERSION=$(git ls-remote --tags origin "refs/tags/${TAG_PREFIX}-v*" \
                        | awk '{print $2}' | grep -v '\^{}$' | sed "s|refs/tags/${TAG_PREFIX}-v||" \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

                      if [ -z "$LAST_VERSION" ]; then
                        VERSION=1.0.0
                      else
                        IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
                        case "${{ parameters.bump }}" in
                          major) VERSION="$((MAJOR + 1)).0.0" ;;
                          minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
                          *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
                        esac
                      fi

                      GIT_TAG="${TAG_PREFIX}-v${VERSION}"
                      IMAGE_GIT_DIGEST=$VERSION
                      echo "release build: ${LAST_VERSION:-<none>} -> $VERSION (bump: ${{ parameters.bump }})"
                    else
                      GIT_TAG=""
                      VERSION=""
                      IMAGE_GIT_DIGEST="$BRANCH_NAME-$SHORT_SHA"
                      if [ "$(IS_PREVIEW)" = "true" ]; then
                        echo "preview build: $IMAGE_GIT_DIGEST (no image, no deploy — uploaded to the Space)"
                      else
                        echo "branch build: $IMAGE_GIT_DIGEST (no git tag)"
                      fi
                    fi

                    echo "##vso[task.setvariable variable=SERVICE_NAME]$SERVICE_NAME"
                    echo "##vso[task.setvariable variable=DOCKERFILE_PATH]$DOCKERFILE_PATH"
                    echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
                    echo "##vso[task.setvariable variable=IMAGE_NAME]$IMAGE_NAME"
                    echo "##vso[task.setvariable variable=BRANCH_NAME]$BRANCH_NAME"
                    echo "##vso[task.setvariable variable=VERSION]$VERSION"
                    echo "##vso[task.setvariable variable=GIT_TAG]$GIT_TAG"
                    echo "##vso[task.setvariable variable=IMAGE_GIT_DIGEST]$IMAGE_GIT_DIGEST"

                    echo "##vso[task.setvariable variable=CONTAINER_REGISTRY_URL]$CONTAINER_REGISTRY_URL"
                    echo "##vso[task.setvariable variable=DOCR_NAME]$DOCR_NAME"
                    echo "##vso[task.setvariable variable=DOCR_CI_USER]$DOCR_CI_USER"
                    echo "##vso[task.setvariable variable=DOCR_CI_PAT]$DOCR_CI_PAT"

                    echo "##vso[task.setvariable variable=GITOPS_GIT_USER]$GITOPS_GIT_USER"
                    echo "##vso[task.setvariable variable=GITOPS_GIT_EMAIL]$GITOPS_GIT_EMAIL"
            env:
                CONTAINER_REGISTRY_URL: $(CONTAINER_REGISTRY_URL)
                DOCR_NAME: $(DOCR_NAME)
                DOCR_CI_USER: $(DOCR_CI_USER)
                DOCR_CI_PAT: $(DOCR_CI_PAT)

                GITOPS_GIT_USER: $(GITOPS_GIT_USER)
                GITOPS_GIT_EMAIL: $(GITOPS_GIT_EMAIL)

          - task: CmdLine@2
            displayName: push semver git tag (reserves the version)
            condition: and(succeeded(), eq(variables.IS_RELEASE, 'true'))
            inputs:
                script: |
                    set -e

                    git config user.email "$GITOPS_GIT_EMAIL"
                    git config user.name "$GITOPS_GIT_USER"

                    # The self-hosted agent reuses the checkout between runs, so
                    # a tag created by an earlier run whose PUSH then failed
                    # lingers locally and would make `git tag -a` fatal. The
                    # remote is the only source of truth (VERSION comes from
                    # ls-remote); local tags are disposable.
                    git tag -d "$GIT_TAG" > /dev/null 2>&1 || true
                    git tag -a "$GIT_TAG" -m "$SERVICE_NAME $VERSION (build $(Build.BuildId) by $(Build.RequestedFor))" HEAD

                    # Nothing has touched the registry yet whenever this push
                    # fails. Only claim a version race if the tag really exists
                    # remotely (a concurrent main build claimed it first —
                    # atomic new-ref push, never force); anything else (403
                    # permission, network) surfaces as-is.
                    if ! git push origin "refs/tags/$GIT_TAG"; then
                      if git ls-remote --exit-code origin "refs/tags/$GIT_TAG" > /dev/null 2>&1; then
                        echo "##vso[task.logissue type=error]$GIT_TAG already exists — a concurrent main build claimed $VERSION. Re-run this pipeline to pick the next number."
                      else
                        echo "##vso[task.logissue type=error]git push of $GIT_TAG failed (not a version race — see output above; likely permissions: the Build Service identity needs Contribute + Create tag on the mockups-lab repo)."
                      fi
                      exit 1
                    fi

          # ── image flow (main, dev, testing, staging) ─────────────────────────

          - task: CmdLine@2
            displayName: build using the dockerfile
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    set -e

                    # APP_VERSION is the exact registry tag this image will be
                    # deployed under; the Dockerfile exports it to the Vite
                    # build, and @mockups/version-badge renders it.
                    docker buildx build \
                      --build-arg APP_VERSION=$IMAGE_GIT_DIGEST \
                      --build-arg APP_COMMIT=$SHORT_SHA \
                      --file $DOCKERFILE_PATH \
                      --tag $SERVICE_NAME:$SHORT_SHA \
                      .

          - task: CmdLine@2
            displayName: tag the image
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    set -e

                    if [ "$(IS_RELEASE)" = "true" ]; then
                      docker image tag $SERVICE_NAME:$SHORT_SHA $IMAGE_NAME:$VERSION
                      docker image tag $SERVICE_NAME:$SHORT_SHA $IMAGE_NAME:$SHORT_SHA
                    else
                      docker image tag $SERVICE_NAME:$SHORT_SHA $IMAGE_NAME:$SHORT_SHA
                      docker image tag $SERVICE_NAME:$SHORT_SHA $IMAGE_NAME:$BRANCH_NAME
                      docker image tag $SERVICE_NAME:$SHORT_SHA $IMAGE_NAME:$BRANCH_NAME-$SHORT_SHA
                    fi

                    echo $IMAGE_GIT_DIGEST

          - task: CmdLine@2
            displayName: authenticate to docr
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    echo $DOCR_CI_PAT | docker login -u $DOCR_CI_USER --password-stdin $CONTAINER_REGISTRY_URL

          - task: CmdLine@2
            displayName: push the image
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    set -e

                    # Explicit tags, not --all-tags: on the shared self-hosted
                    # agent, stale local tags of $IMAGE_NAME from earlier builds
                    # would otherwise be (re-)pushed.
                    if [ "$(IS_RELEASE)" = "true" ]; then
                      docker image push $IMAGE_NAME:$VERSION
                      docker image push $IMAGE_NAME:$SHORT_SHA
                    else
                      docker image push $IMAGE_NAME:$SHORT_SHA
                      docker image push $IMAGE_NAME:$BRANCH_NAME
                      docker image push $IMAGE_NAME:$BRANCH_NAME-$SHORT_SHA
                    fi

          - task: CmdLine@2
            displayName: save variables to artifact
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    cat <<EOT > $(Build.ArtifactStagingDirectory)/build_vars.env
                    SERVICE_NAME=$SERVICE_NAME
                    IMAGE_GIT_DIGEST=$IMAGE_GIT_DIGEST
                    EOT

          - task: PublishBuildArtifacts@1
            displayName: publish build variables artifact
            condition: and(succeeded(), ne(variables.IS_PREVIEW, 'true'))

          # ── preview flow (dev/*, feature/*) ─────────────────────────────────

          - task: CmdLine@2
            displayName: 'preview: build the site (builder stage of the same Dockerfile)'
            condition: and(succeeded(), eq(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    set -e

                    APP_PATH=$(dirname "$DOCKERFILE_PATH")
                    OUT_DIR='${{ parameters.out_dir }}'
                    SITE="$(Build.ArtifactStagingDirectory)/site"

                    # Same Dockerfile, same build args, same version stamp as an
                    # image build — stopped after the builder stage. A fixed tag
                    # keeps the layer cache warm across builds on this agent.
                    docker buildx build --target builder \
                      --build-arg APP_VERSION=$IMAGE_GIT_DIGEST \
                      --build-arg APP_COMMIT=$SHORT_SHA \
                      --file $DOCKERFILE_PATH \
                      --tag $SERVICE_NAME:builder \
                      .

                    # Copy the built site out. docker cp gives the files to the
                    # invoking user, so the next run's rm -rf can clean up.
                    rm -rf "$SITE"
                    CID=$(docker create $SERVICE_NAME:builder)
                    docker cp "$CID:/workspace/$APP_PATH/$OUT_DIR" "$SITE"
                    docker rm -v "$CID" > /dev/null

                    if [ ! -f "$SITE/index.html" ]; then
                      echo "##vso[task.logissue type=error]$APP_PATH/$OUT_DIR has no index.html — is out_dir right for this app? (dist for Vite, storybook-static for Storybook)"
                      exit 1
                    fi
                    du -sh "$SITE"

          - task: CmdLine@2
            displayName: 'preview: upload to the Space, refresh the index pages'
            condition: and(succeeded(), eq(variables.IS_PREVIEW, 'true'))
            inputs:
                script: |
                    set -e

                    SITE="$(Build.ArtifactStagingDirectory)/site"
                    WORK="$(Build.ArtifactStagingDirectory)/index"
                    rm -rf "$WORK" && mkdir -p "$WORK"

                    BUCKET="$SPACES_BUCKET"
                    PREFIX="$SERVICE_NAME/$BRANCH_NAME"
                    HOST="$SERVICE_NAME.dev.bms.qwipo.com"

                    # The agent has no aws cli; run it in a container. Mounts are
                    # read-only so nothing root-owned is left behind on the agent.
                    aws() {
                      docker run --rm \
                        -v "$SITE:/site:ro" -v "$WORK:/work:ro" \
                        -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                        -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                        -e AWS_DEFAULT_REGION=us-east-1 \
                        amazon/aws-cli:2.24.0 --endpoint-url "$SPACES_ENDPOINT" "$@"
                    }

                    # One build, two prefixes. <sha>/ never changes once written,
                    # so it is cached forever; latest/ moves with every push, so
                    # every request revalidates (ETag — cheap).
                    aws s3 sync /site "s3://$BUCKET/$PREFIX/$SHORT_SHA/" --acl public-read --no-progress \
                      --cache-control "public, max-age=31536000, immutable"
                    aws s3 sync /site "s3://$BUCKET/$PREFIX/latest/" --delete --acl public-read --no-progress \
                      --cache-control "public, max-age=0, must-revalidate"

                    # Index pages — plain HTML, regenerated from a bucket listing so
                    # there is no state to corrupt. Each build's index.html is its
                    # marker; LastModified orders them.
                    page() {  # $1 = title; stdin = <li> lines
                      printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>%s</title>' "$1"
                      printf '<style>body{font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;margin:2rem auto;max-width:48rem;padding:0 1rem;color:#222}a{color:#0a58ca}small{color:#888;margin-left:.5rem}</style>'
                      printf '<h1>%s</h1><ul>' "$1"
                      cat
                      printf '</ul>'
                    }

                    {
                      printf '<li><a href="./latest/">latest</a><small>%s · %s</small></li>\n' "$SHORT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREFIX/" \
                        --query "sort_by(Contents[?ends_with(Key, '/index.html')], &LastModified)[::-1].[Key, LastModified]" \
                        --output text \
                      | while read -r key when; do
                          rel="${key#"$PREFIX/"}"
                          case "$rel" in
                            */index.html) sha="${rel%%/*}" ;;
                            *) continue ;;
                          esac
                          if [ "$sha" != "latest" ]; then
                            printf '<li><a href="./%s/">%s</a><small>%s</small></li>\n' "$sha" "$sha" "$when"
                          fi
                        done
                    } | page "$SERVICE_NAME / $BRANCH_NAME" > "$WORK/branch.html"

                    aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$SERVICE_NAME/" --delimiter / \
                      --query 'CommonPrefixes[].Prefix' --output text \
                    | tr '\t ' '\n\n' \
                    | while read -r p; do
                        b="${p#"$SERVICE_NAME/"}"; b="${b%/}"
                        if [ -n "$b" ] && [ "$b" != "None" ]; then
                          printf '<li><a href="./%s/">%s</a></li>\n' "$b" "$b"
                        fi
                      done \
                    | page "$SERVICE_NAME / builds" > "$WORK/app.html"

                    aws s3 cp /work/branch.html "s3://$BUCKET/$PREFIX/index.html" --acl public-read --no-progress \
                      --content-type text/html --cache-control "no-cache"
                    aws s3 cp /work/app.html "s3://$BUCKET/$SERVICE_NAME/index.html" --acl public-read --no-progress \
                      --content-type text/html --cache-control "no-cache"

                    echo ""
                    echo "preview:  https://$HOST/builds/$BRANCH_NAME/$SHORT_SHA/"
                    echo "latest:   https://$HOST/builds/$BRANCH_NAME/latest/"
                    echo "branches: https://$HOST/builds/"
                    echo "##vso[build.addbuildtag]preview"
                    echo "##vso[build.addbuildtag]$BRANCH_NAME"
            env:
                SPACES_BUCKET: $(SPACES_BUCKET)
                SPACES_ENDPOINT: $(SPACES_ENDPOINT)
                SPACES_ACCESS_KEY_ID: $(SPACES_ACCESS_KEY_ID)
                SPACES_SECRET_ACCESS_KEY: $(SPACES_SECRET_ACCESS_KEY)
