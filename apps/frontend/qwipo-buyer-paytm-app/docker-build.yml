# Build pipeline — qwipo-buyer-paytm-app (static SPA behind nginx).
#
# Registered in Azure DevOps as:  \Mockups Lab\Buyer App - Build
# "Buyer App - Deploy" binds to that exact display name via
# `resources.pipelines.source`, so renaming this pipeline breaks the release.
# Rename both or neither.
#
# Left on manual trigger, matching seller-platform. Uncomment the block below
# once someone actually wants a push to dev/main to rebuild automatically —
# note `packages/**` is in the path filter because a change to
# @mockups/design-tokens, @mockups/ui or @mockups/components changes this app's
# output.

# trigger:
#     branches:
#         include:
#             - main
#             - dev
#     paths:
#         include:
#             - 'apps/frontend/qwipo-buyer-paytm-app/**'
#             - 'packages/**'
#             - 'turbo.json'
#             - 'package.json'
#             - 'bun.lock'

trigger: none

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'

extends:
    template: azure-cicd/templates/base-docker-template.yaml@k8s
    parameters:
        service_name_override: 'qwipo-buyer-paytm-app'
        dockerfile: apps/frontend/qwipo-buyer-paytm-app/Dockerfile
