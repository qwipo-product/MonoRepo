<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Red Label, buy 10 cases get 1 free">
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
    <clipPath id="rl-clip"><rect width="240" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#rl-clip)">
    <rect width="240" height="240" fill="url(#rl-bg)"/>
    <circle cx="204" cy="208" r="74" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="26" cy="18" r="44" fill="#FFFFFF" opacity="0.08"/>
    <g opacity="0.22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <path d="M182 56h30v22a15 15 0 0 1-30 0z"/>
      <path d="M212 62h8a7 7 0 0 1 0 14h-8"/>
      <path d="M190 44c0-5 4-7 4-12M202 44c0-5 4-7 4-12"/>
    </g>

    <text x="20" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.6" fill="#FFFFFF" opacity="0.85">RED LABEL</text>

    <text x="20" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="19" font-weight="600" fill="#FFFFFF" opacity="0.9">BUY 10</text>
    <text x="20" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="46" font-weight="800" fill="#FFFFFF">GET 1 FREE</text>

    <text x="20" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="500" fill="#FFFFFF" opacity="0.88">On 250 g cases</text>

    <g transform="translate(20 194)">
      <rect width="116" height="28" rx="14" fill="#FFFFFF"/>
      <text x="16" y="19" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-size="13" font-weight="700" fill="#9F1239">Shop now</text>
      <path d="M94 14h8m-3-3.5 3.5 3.5-3.5 3.5" stroke="#9F1239" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
