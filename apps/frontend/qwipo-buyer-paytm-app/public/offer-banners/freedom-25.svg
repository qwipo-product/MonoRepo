<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Freedom, extra 25 rupees off per tin">
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <clipPath id="fr-clip"><rect width="240" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#fr-clip)">
    <rect width="240" height="240" fill="url(#fr-bg)"/>
    <circle cx="206" cy="210" r="76" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="28" cy="16" r="44" fill="#FFFFFF" opacity="0.08"/>
    <g opacity="0.22" fill="#FFFFFF">
      <path d="M198 36c9 12 14 21 14 29a14 14 0 0 1-28 0c0-8 5-17 14-29z"/>
      <circle cx="216" cy="88" r="7"/>
    </g>

    <text x="20" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.6" fill="#FFFFFF" opacity="0.85">FREEDOM</text>

    <text x="20" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="19" font-weight="600" fill="#FFFFFF" opacity="0.9">EXTRA</text>
    <text x="20" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="52" font-weight="800" fill="#FFFFFF">&#8377;25 OFF</text>

    <text x="20" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
