# Build pipeline — digidukaan (DigiDukaan public website, Vite/React SPA behind nginx).
#
# Registered in Azure DevOps as:  \Mockups Lab\DigiDukaan - Build
# "DigiDukaan - Deploy" binds to that exact display name via
# `resources.pipelines.source`, so renaming this pipeline breaks the release.
# Rename both or neither.
#
# Generated by scripts/add-deploy.ts, then narrowed on purpose:
#
#   - PRODUCTION ONLY. DigiDukaan has no dev, testing or staging deployment and
#     no preview builds, so this triggers on `main` alone. Every run is a
#     release candidate for https://digidukaan.qwipo.com and its deploy waits
#     on the `mockups-production` approval.
#   - The path filter lists only the shared packages this app builds from
#     (version-badge, tsconfig, eslint-config), so an unrelated shared-package
#     change does not queue a public-site release.
#
# The build logic and the versioning model live in
# azure-cicd/templates/mockup-docker-template.yaml, shared by every mockup.
#
# ── Versions ─────────────────────────────────────────────────────────────────
#
#     main  → next semver from the `digidukaan-v*` git tags; the tag
#             `digidukaan-v<semver>` is pushed, the image is <semver>
#
# `bump`: an auto-triggered run always takes patch; run the pipeline by hand
# and pick minor/major for a bigger step.
#
# The tag prefix below is a literal, on purpose. Regenerating with a different
# --service changes it and forks the tag lineage.

trigger:
    branches:
        include:
            - main
    paths:
        include:
            - 'apps/frontend/digidukaan/**'
            - 'packages/version-badge/**'
            - 'packages/tsconfig/**'
            - 'packages/eslint-config/**'
            - 'turbo.json'
            - 'package.json'
            - 'bun.lock'

parameters:
    - name: bump
      displayName: Semver bump (auto-triggered runs always patch)
      type: string
      default: patch
      values:
          - patch
          - minor
          - major

extends:
    template: /azure-cicd/templates/mockup-docker-template.yaml
    parameters:
        service_name: 'mockups-digidukaan'
        tag_prefix: 'digidukaan'
        dockerfile: apps/frontend/digidukaan/Dockerfile
        bump: ${{ parameters.bump }}
