# nginx config for the qwipo-app-v2 SPA.
#
# - listen on 80 (the only port nginx-alpine exposes by default)
# - serve the Vite build from /usr/share/nginx/html
# - SPA fallback: any path that isn't a file falls through to /index.html
# - long-cache the content-hashed bundles Vite emits, never-cache index.html
#   so a deploy is live on the next request without operator action
# - never cache /configs/config.json — entrypoint.sh rewrites it at container
#   start based on NODE_ENV

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Runtime config — rewritten per NODE_ENV at boot. Must NOT be cached.
    # Declared before the static-asset rule so the .json extension doesn't
    # pick up the immutable Cache-Control below.
    location = /configs/config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
        try_files  $uri =404;
    }

    # Vite emits content-hashed filenames — safe to cache forever.
    # The mockups also ship a lot of un-hashed imagery under public/; caching
    # those for a year is fine, they're replaced by name when they change.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache, so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # SPA fallback. This app drives screens through its own in-memory navigator
    # rather than a URL router, so in practice every deep link lands here —
    # which is exactly what we want: any shared link opens the mockup from the
    # top.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
