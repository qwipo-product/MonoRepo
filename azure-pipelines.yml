# Root pipeline entry — Azure DevOps defaults a pipeline's YAML path to
# /azure-pipelines.yml. The real per-app definitions live under
# apps/<area>/<app>/docker-build.yml; this file just points the default-path
# pipeline at the qwipo-app-v2 build so branch/tag runs resolve.
#
# If you register a pipeline directly against apps/frontend/qwipo-app-v2/
# docker-build.yml, you don't need this file — delete it.

trigger: none

resources:
    repositories:
        - repository: k8s
          type: git
          name: 'Qwipo B2B/k8s'
          ref: 'refs/heads/main'

extends:
    template: azure-cicd/templates/base-docker-template.yaml@k8s
    parameters:
        service_name_override: mockups-qwipo-buyer-app
        dockerfile: apps/frontend/qwipo-app-v2/Dockerfile
