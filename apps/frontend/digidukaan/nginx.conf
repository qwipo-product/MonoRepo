# nginx config for digidukaan — Vite/React SPA.
#
# Generated by scripts/add-deploy.ts.
# Before regeneration, use .claude/skills/deploy-mockup/SKILL.md.
#
# - listen on 80 (the only port nginx-alpine exposes by default)
# - serve the build from /usr/share/nginx/html
# - fallback: any path that isn't a file on disk falls through to /index.html
# - long-cache the content-hashed bundles, never-cache index.html so a deploy
#   is live on the next request without operator action

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Content-hashed filenames — safe to cache forever. Un-hashed imagery under
    # public/ is fine here too; it is replaced by name when it changes.
    #
    # JSON is deliberately not cached by the asset rule.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache, so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }

    # No preview proxy. The other mockups proxy /builds/ to the qwipo-mockups
    # Space for branch previews. DigiDukaan is a public production-only site with
    # no preview builds, so this image never reaches the bucket and /builds is a
    # plain 404 rather than a fallback to the home page.
    location ^~ /builds {
        return 404;
    }

    # SPA fallback. This app navigates with query strings and section hashes,
    # so nothing depends on this today. Kept because it is the right default:
    # a stray real path lands on the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
